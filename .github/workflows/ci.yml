# Tests on every push and pull request; the site is published to GitHub Pages only from main, and only when every test passed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      PP_ENGINES: ${{ matrix.engine }}
      PP_CHROMIUM_CHANNEL: ''          # empty = Playwright's own Chromium (locally the tests use the installed Chrome)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps ${{ matrix.engine }}
      - name: The service worker's file list is current
        run: python tools/make_sw.py --check
      - run: python -m pytest tests
      - name: Keep the screenshots the layout tests took
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.engine }}
          path: test-results/
          if-no-files-found: ignore

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5

  # After a deploy: the site that is really live serves this commit's files, with the right types, under its path, and plays offline.
  live:
    name: check the live site
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PP_CHROMIUM_CHANNEL: ''
      PP_LIVE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium webkit
      - run: python -m pytest tests/test_live.py
