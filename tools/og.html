<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Path Patrol: social image</title>
<!-- Rendered to site/og.png by tools/make_screenshots.py (1200 x 630). {{ROOT}} and {{BOARD}} are filled in by that script. -->
<style>
  @font-face { font-family: "Space Grotesk"; src: url("{{ROOT}}/site/assets/fonts/space-grotesk-variable.woff2") format("woff2"); font-weight: 300 700; }
  @font-face { font-family: "DM Mono"; src: url("{{ROOT}}/site/assets/fonts/dm-mono-400.woff2") format("woff2"); font-weight: 400; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #070b12; }
  body {
    position: relative; color: #e8f1ee; font-family: "DM Mono", monospace;
    background:
      radial-gradient(760px 520px at 80% 38%, rgba(114, 244, 209, .16), transparent 62%),
      radial-gradient(500px 360px at 8% 96%, rgba(255, 118, 95, .10), transparent 64%),
      #070b12;
  }
  .grid { position: absolute; inset: 0; background-image: radial-gradient(rgba(190, 224, 216, .16) 1.2px, transparent 1.4px); background-size: 34px 34px; mask-image: linear-gradient(90deg, #000, transparent 55%); -webkit-mask-image: linear-gradient(90deg, #000, transparent 55%); }
  .left { position: absolute; left: 76px; top: 0; bottom: 0; width: 500px; display: flex; flex-direction: column; justify-content: center; gap: 30px; }
  .mark { display: flex; align-items: flex-end; gap: 9px; width: 96px; height: 84px; transform: skewY(-18deg); margin-left: 4px; }
  .mark i { display: block; width: 25px; background: #72f4d1; border-radius: 4px; }
  .mark i:nth-child(1) { height: 40px; opacity: .55; }
  .mark i:nth-child(2) { height: 84px; }
  .mark i:nth-child(3) { height: 60px; opacity: .76; }
  h1 { margin: 0; font: 700 88px/.92 "Space Grotesk", sans-serif; letter-spacing: -.06em; }
  h1 span { color: #72f4d1; margin-inline: .03em; }
  .tag { font-size: 23px; color: #b9c8c7; line-height: 1.35; }
  .tag b { color: #72f4d1; font-weight: 400; }
  .chips { display: flex; gap: 12px; flex-wrap: wrap; }
  .chips span { padding: 8px 14px; border: 1px solid rgba(190, 224, 216, .3); border-radius: 6px; color: #b9c8c7; font-size: 18px; }
  .shot { position: absolute; right: 52px; top: 153px; width: 540px; height: 324px; border-radius: 14px; overflow: hidden; border: 1px solid rgba(190, 224, 216, .3); box-shadow: 0 30px 80px rgba(0, 0, 0, .65); background: #0b1422; }
  .shot img { display: block; width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="left">
    <div class="mark" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1>PATH<span>/</span>PATROL</h1>
    <div class="tag"><b>&gt;</b> claim the quiet side of the board_</div>
    <div class="chips"><span>one touch</span><span>daily board</span><span>works offline</span></div>
  </div>
  <div class="shot"><img src="{{BOARD}}" alt=""></div>
</body>
</html>
